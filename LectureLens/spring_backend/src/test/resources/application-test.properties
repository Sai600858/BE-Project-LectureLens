# Test Profile Configuration
spring.application.name=lecturelens-backend-test

spring.datasource.url=jdbc:h2:mem:lecturelens_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

lecturelens.jwt.secret=TestSecretKeyForLectureLensJavaSpringBootPlatformTest2026Only
lecturelens.jwt.expiration-ms=3600000

lecturelens.service.secret=TestInternalServiceCommunicationSecretKey2026Only
lecturelens.media-service.url=http://localhost:3001

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
