server.port=${SERVER_PORT:8080}

spring.application.name=lecturelens-backend

# Datasource configuration
# Default: In-memory H2 with PostgreSQL compatibility mode for unit/integration tests
# Switch to persistent PostgreSQL by launching with --spring.profiles.active=postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:lecturelens;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA & Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway Versioned Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# H2 Console (Development only)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# JWT Configuration
lecturelens.jwt.secret=${JWT_SECRET:LectureLensSuperSecretKeyForJwtAuthenticationInJava21SpringBootPlatform2026}
lecturelens.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Inter-Service Authentication & Media Service Integration
lecturelens.service.secret=${SERVICE_SECRET:InternalLectureLensServiceCommunicationSecretKey2026}
lecturelens.media-service.url=${MEDIA_SERVICE_URL:http://localhost:3001}

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Actuator Health & Metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# SpringDoc OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
logging.level.com.lecturelens=DEBUG
