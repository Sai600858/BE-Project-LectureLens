    const edges = [{"source": "node_prog_seg_01", "target": "node_prog_vis_01", "relation": "corresponds_to", "confidence": 0.4304, "status": "accepted", "provenance_seg": ["prog_seg_01"], "provenance_vis": ["prog_vis_01"]}, {"source": "concept_for_finding_target_keys_in_loga", "target": "node_prog_vis_01", "relation": "explains", "confidence": 0.4304, "status": "accepted", "provenance_seg": ["prog_seg_01"], "provenance_vis": ["prog_vis_01"]}, {"source": "node_prog_seg_02", "target": "node_prog_vis_02", "relation": "corresponds_to", "confidence": 0.3415, "status": "accepted", "provenance_seg": ["prog_seg_02"], "provenance_vis": ["prog_vis_02"]}, {"source": "concept_before", "target": "node_prog_vis_02", "relation": "explains", "confidence": 0.3415, "status": "accepted", "provenance_seg": ["prog_seg_02"], "provenance_vis": ["prog_vis_02"]}, {"source": "concept_binary_search", "target": "node_prog_vis_02", "relation": "explains", "confidence": 0.3415, "status": "accepted", "provenance_seg": ["prog_seg_02"], "provenance_vis": ["prog_vis_02"]}, {"source": "concept_sorted_arrays", "target": "node_prog_vis_02", "relation": "explains", "confidence": 0.3415, "status": "accepted", "provenance_seg": ["prog_seg_02"], "provenance_vis": ["prog_vis_02"]}, {"source": "concept_sorted_arrays", "target": "concept_binary_search", "relation": "requires_prerequisite", "confidence": 0.3415, "status": "accepted", "provenance_seg": ["prog_seg_02"], "provenance_vis": ["prog_vis_02"]}, {"source": "concept_array_indexing_fundamentals", "target": "concept_binary_search", "relation": "requires_prerequisite", "confidence": 0.3415, "status": "accepted", "provenance_seg": ["prog_seg_02"], "provenance_vis": ["prog_vis_02"]}, {"source": "node_prog_seg_03", "target": "node_prog_vis_03", "relation": "corresponds_to", "confidence": 0.7221, "status": "accepted", "provenance_seg": ["prog_seg_03"], "provenance_vis": ["prog_vis_03"]}, {"source": "concept_the", "target": "node_prog_vis_03", "relation": "exp     const svg = document.getElementById('svg-graph');
    const width = 1200;

    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

    // Simple deterministic radial/force-inspired layout
    const N = nodes.length;
    const radius = Math.min(width, height) * 0.40;
    const cx = width / 2;
    const cy = height / 2;

    nodes.forEach((n, i) => {
      const angle = (2 * Math.PI * i) / N;
      n.x = cx + radius * Math.cos(angle) + (i % 2 === 0 ? 30 : -30);
      n.y = cy + radius * Math.sin(angle) + (i % 3 === 0 ? 25 : -25);
    });

    // Render Edges
    edges.forEach(e => {

      const t = nodeMap[e.target];
      if (!s || !t) return;

      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', s.x);
      line.setAttribute('y1', s.y);
      line.setAttribute('x2', t.x);
      line.setAttribute('y2', t.y);

      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');

      const label = n.label.length > 22 ? n.label.substring(0, 20) + '...' : n.label;

      text.setAttribute('x', n.x);
      text.setAttribute('y', n.y + 4);
      text.setAttribute('text-anchor', 'middle');

      const boxW = Math.max(100, label.length * 7 + 16);
      const boxH = 26;
      rect.setAttribute('x', n.x - boxW/2);
      rect.setAttribute('y', n.y - boxH/2);
      rect.setAttribute('width', boxW);
      rect.setAttribute('height', boxH);
      rect.setAttribute('rx', 6);
      rect.setAttribute('fill', n.color);

      g.appendChild(text);
